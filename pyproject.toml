[project]
name = "triagelens"
version = "0.0.0"
description = "AI-assisted test failure triage and test knowledge assistant for synthetic 5G device testing"
readme = "README.md"
license = "MIT"
requires-python = ">=3.15"

[dependency-groups]
dev = ["ruff", "pytest"]

[tool.ruff]
# py315 support in ruff is still in preview; see docs/devlog.md.
target-version = "py314"
line-length = 100
# Our own packages, so imports sort them as first-party.
src = [".", "simulator/src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # modern syntax
    "B",    # likely bugs
    "SIM",  # simplifications
    "ANN",  # type hints everywhere
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["ANN"]

[tool.pytest.ini_options]
minversion = "9.0"
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
testpaths = ["apps", "libs", "simulator", "evals"]
